server:
  port: 1236

spring:
  application:
    name: MindAiSpringBoot
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  ai:
    openai:
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3.2
          tool-calling:
            enabled: true
        completions-path: /v1/chat/completions
      api-key: ${AI_API_KEY}
      base-url: https://api.siliconflow.cn
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
file:
  upload-dir: D:\mindAI_Springboot\file
  # ⚠️ 改这个前缀必须同步改 FileService 里入库的 "/files/"（两处是各自写死的，没联动）
  access-prefix: /files/**

jwt:
  secret: ${JWT_SECRET:MySecretKeyForJWT2026_dev_only}
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀