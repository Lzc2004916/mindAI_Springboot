server:
  port: 1236

spring:
  application:
    name: MindAiSpringBoot
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  ai:
    openai:
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3.2
          tool-calling:
            enabled: true
        completions-path: /v1/chat/completions
      api-key: ${AI_API_KEY}
      base-url: https://api.siliconflow.cn
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
file:
  upload-dir: D:\mindAI_Springboot\file
  # ⚠️ 改这个前缀必须同步改 FileService 里入库的 "/files/"（两处是各自写死的，没联动）
  access-prefix: /files/**

jwt:
  # ⚠️ 必须由环境变量注入，禁止再写默认值：仓库里出现过的两个默认密钥已永久泄露（安全审查 S-01）。
  #    这里只留 ":}"（空串兜底）是故意的 —— 让"没配"绑定成空串，由 JwtConfig 的启动自检报出可操作的错误，
  #    而不是抛难懂的 "Could not resolve placeholder 'JWT_SECRET'"。
  secret: ${JWT_SECRET:}
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀