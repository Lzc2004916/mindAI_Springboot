# ============================================================
# GitHub Actions 部署流水线
# 触发：push 到 main 分支 → 构建镜像 → 推送到 Registry → SSH 部署
# 需在 GitHub Secrets 配置:
#   SSH_HOST, SSH_USER, SSH_KEY, REGISTRY_USER, REGISTRY_TOKEN
# ============================================================
name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test -B

      - name: Build with Maven
        run: mvn package -DskipTests -B

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/mindai
            docker compose pull app
            docker compose up -d --no-deps app
            # 健康检查
            for i in $(seq 1 12); do
              if curl -sf http://localhost:1236/actuator/health/readiness | grep -q UP; then
                echo "部署成功"
                exit 0
              fi
              sleep 5
            done
            echo "健康检查失败，回滚"
            docker compose down app
            docker compose up -d --no-deps app
            exit 1
